<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#172554" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#primaryGrad)" />

  <!-- Inner Subtle Ring -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" />

  <!-- Exam Document & Pen Emblem -->
  <g filter="url(#shadow)">
    <!-- Main Sheet -->
    <rect x="140" y="110" width="232" height="292" rx="24" fill="#ffffff" />
    
    <!-- Header bar on sheet -->
    <rect x="170" y="150" width="100" height="14" rx="7" fill="#2563eb" />
    <circle cx="340" cy="157" r="8" fill="#10b981" />

    <!-- Exam lines -->
    <rect x="170" y="186" width="172" height="10" rx="5" fill="#e2e8f0" />
    <rect x="170" y="210" width="130" height="10" rx="5" fill="#e2e8f0" />
    <rect x="170" y="234" width="155" height="10" rx="5" fill="#e2e8f0" />

    <!-- Question divider -->
    <line x1="170" y1="262" x2="342" y2="262" stroke="#f1f5f9" stroke-width="2" stroke-linecap="round" />

    <!-- MCQ bullets / marks -->
    <circle cx="180" cy="288" r="6" fill="#60a5fa" />
    <rect x="198" y="284" width="90" height="8" rx="4" fill="#cbd5e1" />

    <circle cx="180" cy="312" r="6" fill="#cbd5e1" />
    <rect x="198" y="308" width="115" height="8" rx="4" fill="#cbd5e1" />

    <circle cx="180" cy="336" r="6" fill="#cbd5e1" />
    <rect x="198" y="332" width="80" height="8" rx="4" fill="#cbd5e1" />

    <!-- WAEC Grade Stamp -->
    <rect x="254" y="356" width="90" height="26" rx="13" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
    <text x="299" y="373" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">ROCKCRAF</text>

    <!-- Floating Craft Pen Quill -->
    <g transform="translate(315, 230) rotate(-35)">
      <rect x="0" y="0" width="18" height="110" rx="9" fill="url(#accentGrad)" />
      <polygon points="0,110 9,132 18,110" fill="#0284c7" />
      <circle cx="9" cy="120" r="2.5" fill="#ffffff" />
      <rect x="2" y="8" width="14" height="20" rx="4" fill="rgba(255,255,255,0.4)" />
    </g>
  </g>
</svg>
